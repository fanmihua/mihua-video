  <style>
    /* 布局 B「聚光灯下的米花」：
       一束光从上面打下来，米花站在光里放大，爆米花往标题方向蹦；存钱罐跟米花一起站在光里；
       场记板、分镜板、话筒、摄影机贴着画面边角、切掉一部分，像镜头推近了片场；
       标题居中，上面贴一条片场胶带当小字；标题下面不放小字。
       插画是片场母版 src/partials/set/master.html 里的分组原样复制过来的（id 前缀 cv-），只在这里重新摆位置和大小。 */
    .mset-svg.cv { width: 1242px; height: 1656px; }
    /* 片场里的影子是浅灰色，压在深色舞台上会变成一块亮斑：封面里一律改成半透明的黑 */
    .mset-svg.cv .sh { fill: rgba(0, 0, 0, 0.26); }
    /* 边角道具退后一点：米花是焦点 */
    .mset-svg.cv .prop { opacity: 0.8; }
    /* 话筒旁边的音符离米花太近，挤：封面里不要 */
    #cv-note { display: none; }
    /* 米花：抬眼看标题，张嘴笑 */
    #cv-mh-pl { transform: translate(-15px, -77px); }
    #cv-mh-pr { transform: translate(19px, -77px); }
    #cv-mh-smile { display: none; }

    .hd { position: absolute; left: 0; right: 0; top: 294px; z-index: 3; text-align: center; font-family: "ShuHei", sans-serif; font-weight: 700; color: #f6f6f6; line-height: 1.12; letter-spacing: 2px; white-space: nowrap; }
    .hd div { font-size: 216px; }
    .hd .q { margin-right: -0.42em; }
    /* 标题上面的胶带（和片场地上的编号胶带同一种画法） */
    svg.tape-top { position: absolute; left: 0; top: 0; width: 1242px; height: 1656px; overflow: visible; z-index: 4; pointer-events: none; }
    .tape-top .tp { fill: #f7f7f5; stroke: #161616; stroke-width: 3; }
    .tape-top text { font-family: "ShuHei", sans-serif; font-weight: 700; font-size: 58px; fill: #161616; letter-spacing: 3px; }
    .tape-top .burst { fill: none; stroke: #f2f2f2; stroke-width: 9; stroke-linecap: round; }
  </style>
</head>
