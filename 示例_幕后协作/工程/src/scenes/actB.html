      <script>
        //@COMMON_JS@
        <!--@@INCLUDE:src/partials/kit.js@@-->
        <!--@@INCLUDE:src/partials/set/set.js@@-->
        (function () {
          const C = /*@CUES@*/;
          const tl = gsap.timeline({ paused: true });
          kPinTimeline(tl, C.end);
          // 章节卡：接着开场最后那个画面（同一个角落、同一个镜头），所以不重画
          const scam = hfCam("#b-setw");
          const S = hfCard("b-s-", tl, scam, 0, { draw: null, prop: C.l1 - 0.35, hold: C.l3 });

          // ── 两件事：场记板往左让开，光圈收小，别的角落退掉 ──
          const R = C.l3 - 0.55;
          tl.to(S.corners.slice(1), { opacity: 0, duration: 0.6 }, R);
          tl.to(["#b-s-route", "#b-s-beam", "#b-s-tapes"], { opacity: 0, duration: 0.5 }, R);
          tl.to("#b-s-light", { scale: 0.38, x: 0, y: 40, duration: 1.1, ease: "power2.inOut" }, R);
          scam.focus(tl, 760, 650, 2.0, R, 1.1);
          S.clapTo(0, R + 0.2, 0.35);
          S.walk(806, 784, 1.0, R + 0.1, 1.0);
          S.pose(R + 1.1, "mh-point", [-4, -5], "smile");
          S.blink(R + 1.4);
          S.boil(C.l3, C.end);
          gsap.set(["#b-cd1", "#b-cd2", "#b-strip", "#b-stt", "#b-an1", "#b-an2", "#b-ang", "#b-qb", "#b-th", "#b-ok", "#b-ev2"], { opacity: 0 });
          // 大家最想知道的 / 对大家有什么用：两张小卡贴上来（线条一笔笔画出来）
          [["#b-cd1", C.l4 - 0.3], ["#b-cd2", C.l5 - 0.3]].forEach(([g, t]) => {
            tl.set(g, { opacity: 1 }, t);
            S.drawEls([...document.querySelectorAll(g + " > g rect, " + g + " > g path")], t, 0.55);
            tl.fromTo(document.querySelectorAll(g + " > text:not(.ans)"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, t + 0.35);
          });
          // 「最好一句话就能说清楚」：场记板上贴一条片名条；「一句话故事」写上去
          tl.to("#b-strip", { opacity: 1, duration: 0.45, ease: "power2.out" }, C.l6 + 0.3);
          tl.to("#b-stt", { opacity: 1, duration: 0.5 }, C.l7 + 0.6);
          // 比如这期：同学们问的（原样）→ 细线连到第一张卡 → 卡上写这期的答案
          tl.to("#b-ev .tp", { opacity: 1, duration: 0.35 }, C.l9 - 0.25);
          ["#b-fb1", "#b-fb2", "#b-fb3"].forEach((f, i) => hfReveal(tl, f, C.l9 + i * 0.25, { y: 10, blur: 6 }));
          const dash = (k, w, t) => { const L = document.getElementById(k).getTotalLength(); gsap.set(["#" + k, "#" + w], { strokeDashoffset: L, strokeDasharray: L + " " + L, opacity: 0 });
            tl.set(["#" + k, "#" + w], { opacity: 1 }, t);   // 画之前整条藏起来：圆角线头会先冒出一个小点
            tl.to("#" + k, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, t);
            tl.to("#" + w, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, t); tl.set("#" + w, { strokeDasharray: "5 5", strokeDashoffset: 0 }, t + 0.72); };
          dash("b-l1k", "b-l1", C.l10 - 0.5);
          tl.to("#b-an1", { opacity: 1, duration: 0.45 }, C.l10 + 0.1);
          // 看完大家就知道：这期的七章——画面顶上真的导航
          tl.to("#b-ev", { opacity: 0.55, duration: 0.5 }, C.l11 - 0.2);
          tl.to("#b-an2", { opacity: 1, duration: 0.45 }, C.l12 - 0.1);
          dash("b-l2k", "b-l2", C.l12 + 0.2);
          hfOutline(tl, "#b-navbox", C.l12 + 0.6, 2.4);
          pinAt("#b-navn", 1332, 61.5, false);
          hfNote(tl, "#b-navn", C.l12 + 0.9, 2.1);

          // 「这句话想清楚了，标题基本也就有了」：镜头推到场记板上那条片名条——「片名」那一格写的就是这句话；「片名」反白
          scam.focus(tl, 511, 640, 3.4, C.l13 - 0.3, 1.0);
          tl.to(["#b-ev", "#b-l1k", "#b-l1", "#b-l2k", "#b-l2"], { opacity: 0.25, duration: 0.5 }, C.l13 - 0.3);
          const pm = document.getElementById("b-pm"), pmhl = document.getElementById("b-pmhl");
          kLive(tl, pm, () => { const b = pm.getBBox(); pmhl.setAttribute("x", b.x - 4); pmhl.setAttribute("y", b.y - 1); pmhl.setAttribute("width", b.width - 1); pmhl.setAttribute("height", b.height + 2); }, C.end);
          gsap.set(pmhl, { scaleX: 0, transformOrigin: "0% 50%", transformBox: "fill-box" });
          tl.to(pmhl, { scaleX: 1, duration: 0.35, ease: "power2.out" }, C.l13 + 0.9);
          tl.to(pm, { fill: "#f7f7f5", duration: 0.2 }, C.l13 + 1.0);

          // ── 甩上去：上一期的封面（提一个问题）和真实的发布标题（讲怎么解决）──
          const out = C.l14 - 0.45;
          tl.to("#b-card", { y: -1300, duration: 0.6, ease: "power3.in" }, out);
          hfMotionBlur(tl, "#b-card", document.getElementById("b-mbvg"), "y", out, 0.6, 40);
          tl.set("#b-card", { opacity: 0 }, out + 0.62);
          gsap.set("#b-in", { y: 900 });
          tl.to("#b-in", { y: 0, duration: 0.75, ease: "power3.out" }, out + 0.35);
          const cam = hfCam("#b-w");
          cam.set(1, -1920, 0);
          hfArrive(tl, "#b-cover", C.l14 + 0.05, { z: -1600, rx: 12 });
          pin("#b-covn", "#b-cover", "r", { at: 0.47 });
          hfNote(tl, "#b-covn", C.l14 + 0.6, 2.4);
          hfArrive(tl, "#b-title", C.l15 - 0.2, { z: -1400, rx: 10 });
          // 「为什么 Design.md 不够用」：推到封面那句问题
          cam.focus(tl, 2400, 480, 1.45, C.l16 - 0.3, 1.0);
          hfOutline(tl, "#b-covbox", C.l17 - 0.1, 2.3);
          // 「标题写的就是 / 一份设计稿如何让AI落到4套组件库？」
          cam.focus(tl, 3190, 650, 1.45, C.l18 - 0.4, 1.0);
          hfOutline(tl, "#b-tbox", C.l19 + 0.1, 2.2);
          pin("#b-tn", "#b-title", "b", { at: 0.12 });
          hfNote(tl, "#b-tn", C.l19 + 0.4, 2.2);
          cam.focus(tl, 2880, 540, 1.0, C.l19e + 0.1, 1.1);

          // ── 落回片场：摄影机（AI）帮着想角度，最后讲什么米花自己定 ──
          const back = C.l20 - 0.5;
          tl.to("#b-in", { y: 1300, duration: 0.6, ease: "power3.in" }, back);
          hfMotionBlur(tl, "#b-in", document.getElementById("b-mbvg"), "y", back, 0.6, 40);
          tl.set("#b-card", { opacity: 1 }, back);
          tl.to("#b-card", { y: 0, duration: 0.75, ease: "power3.out" }, back + 0.3);
          tl.set(["#b-cd1", "#b-cd2", "#b-ev", "#b-l1k", "#b-l1", "#b-l2k", "#b-l2"], { opacity: 0 }, back + 0.3);
          // 摄影机（06 角落里的那台）挪到米花右边；导演椅不要
          const c6 = document.getElementById("b-s-c6"), m6 = { x: 1470, y: 522 };
          const ap6 = () => c6.setAttribute("transform", "translate(" + m6.x + " " + m6.y + ") scale(0.92)");
          tl.set(["#b-s-chair", "#b-s-chairsign"], { opacity: 0 }, back);
          tl.to(m6, { x: 950, y: 790, duration: 0.01, onUpdate: ap6 }, back + 0.3);
          tl.set(c6, { opacity: 1 }, back + 0.3);
          tl.to("#b-s-light", { scale: 0.48, x: 122, y: 49, duration: 0.01 }, back + 0.3);
          scam.focus(tl, 800, 620, 1.8, back + 0.3, 0.01);
          S.walk(752, 784, 1.0, back + 0.3, 0.01);
          S.pose(back + 0.3, "mh-down", [4, 0], "smile");
          S.crew(C.l20, 3.0);
          tl.to("#b-qb", { opacity: 0, duration: 0.01 }, back);
          // 「让它帮我想想角度」：几个角度从摄影机那边冒出来
          tl.fromTo("#b-ang", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, C.l21 - 0.1);
          // 「但最后讲什么 / 还是要我自己来定」：角度退后，米花指着场记板上的片名，打个勾
          tl.to("#b-ang", { opacity: 0.35, duration: 0.5 }, C.l22 - 0.1);
          S.pose(C.l22 - 0.1, "mh-point", [-4, -3], "smile");
          tl.set("#b-ok", { opacity: 1 }, C.l23);
          S.drawEls([...document.querySelectorAll("#b-ok path")], C.l23, 0.4);
