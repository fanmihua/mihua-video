          [["#f-u1", C.l46], ["#f-u2", C.l46 + 0.15], ["#f-u3", C.l46 + 0.9], ["#f-u4", C.l46 + 1.05]].forEach(([u, t]) => hfOutline(tl, u, t, 2.6));
          [["#f-u5", C.l47 - 0.1], ["#f-u6", C.l47 + 0.05]].forEach(([u, t]) => hfOutline(tl, u, t, 2.8));
          [["#f-u7", C.l48 - 0.1], ["#f-u8", C.l48 + 0.05]].forEach(([u, t]) => hfOutline(tl, u, t, 4.2));
          cam.focus(tl, 4800, 1620, 1, C.l50 - 0.4, 0.9);
          pin("#f-sk1", "#f-pm", "r", { at: 0.55 });
          hfNote(tl, "#f-sk1", C.l50, 2.2);

          // ── ⑤ 第二个参考 ──
          whip(960, 2700, C.l51 - 0.5, "y");
          hfArrive(tl, "#f-r2", C.l51 - 0.4, { z: -1400, rx: 10 });
          show("#f-s2c", C.l51);
          hfReveal(tl, "#f-qc", C.l55 - 0.1);
          hfReveal(tl, "#f-qd", C.l56 - 0.1);
          // 我们拿的：干净的线条、一点点搭起来——上一期就是这样一层层搭出来的
          hide(["#f-qc", "#f-qd"], C.l57 - 0.3);
          hfArrive(tl, "#f-ours2", C.l57 - 0.2, { z: -1200, rx: 8 });
          // 浅色底和橙色，没拿
          hfOutline(tl, "#f-t1", C.l59, 1.8); hfOutline(tl, "#f-t2", C.l59 + 0.3, 1.5);
          pin("#f-nt1", "#f-r2", "r", { at: 0.66 }); hfNote(tl, "#f-nt1", C.l59 + 0.4, 1.6);
          // 提示词只有一两句
          hide("#f-ours2", C.l60 - 0.5);
          hfArrive(tl, "#f-tp", C.l60 - 0.4, { z: -1200, rx: 8 });
          // 直接看画面，把想要的那一点指给 AI 看
          hide("#f-tp", C.l62 - 0.3);
          hfOutline(tl, "#f-t3", C.l63, 2.4);
          pin("#f-nt2", "#f-r2", "r", { at: 0.28 }); hfNote(tl, "#f-nt2", C.l63 + 0.3, 2.2);

          // ── ⑥ 小结 ──
          whip(2880, 2700, C.l64 - 0.45);
          gsap.set("#f-sum", { opacity: 0 }); tl.set("#f-sum", { opacity: 1 }, C.l64 - 0.2);
          S.drawEls([...document.querySelectorAll("#f-sum > g rect")], C.l64 - 0.2, 0.5);
          tl.fromTo("#f-sum > text", { opacity: 0 }, { opacity: 1, duration: 0.4 }, C.l64 + 0.3);
          [["#f-li1", C.l65], ["#f-li2", C.l66], ["#f-li3", C.l67], ["#f-li4", C.l68]].forEach(([li, t]) => {
            gsap.set(li, { opacity: 0 }); tl.set(li, { opacity: 1 }, t - 0.1);
            S.drawEls([...document.querySelectorAll(li + " path")], t - 0.1, 0.35);
            tl.fromTo(document.querySelectorAll(li + " text"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4 }, t);
          });

          // ── ⑦ 对着画面说「不要」，一版一版收窄到现在 ──
          // 「后面做的时候，我也是对着画面，一条一条说不要」时还停在小结上；说到第一句「不要」再甩过去
          whip(4800, 2700, C.l71 - 0.55);
          hfReveal(tl, "#f-qe", C.l71 - 0.05);
          hfReveal(tl, "#f-qf", C.l72 - 0.1);
          hfArrive(tl, "#f-now", C.l74 - 0.3, { z: -1400, rx: 10 });

          // ── ⑧ 五块 ──
          whip(960, 3780, C.l75 - 0.5, "y");
          show("#f-5c", C.l75);
          const rows = ["#f-5a", "#f-5b", "#f-5d", "#f-5e", "#f-5f"], ex = ["#f-ex1", "#f-ex2", "#f-ex3", "#f-ex4", "#f-ex5"];
          // 「我把它分成五块」：五块的名字先一起排出来（淡），说到哪块哪块亮、说明和例子出来
          gsap.set(rows.map((r) => r + " .v"), { opacity: 0 });
          tl.fromTo(rows, { opacity: 0, x: -16 }, { opacity: 0.45, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.12 }, C.l75 + 0.6);
          [C.l78, C.l79, C.l80, C.l81, C.l82].forEach((t, i) => {
            tl.to(rows[i], { opacity: 1, duration: 0.3 }, t - 0.15);
            tl.to(rows[i] + " .v", { opacity: 1, duration: 0.4 }, t - 0.1);
            if (i) { tl.to(rows[i - 1], { opacity: 0.4, duration: 0.3 }, t - 0.15); tl.to(ex[i - 1], { opacity: 0, duration: 0.3 }, t - 0.15); }
            tl.fromTo(ex[i], { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, t - 0.1);
          });

          // ── ⑨ 写进 Skill ──
          whip(2880, 3780, C.l83 - 0.45);
          hfArrive(tl, "#f-bs", C.l84 - 0.3, { z: -1200, rx: 8 });
          tl.to("#f-bs", { opacity: 0.35, duration: 0.4 }, C.l85 - 0.3);
          hfArrive(tl, "#f-sd", C.l85 - 0.2, { z: -1200, rx: 8 });
          hfOutline(tl, "#f-sdb", C.l86 + 0.1);
          pin("#f-sdn", "#f-sd", "b", { at: 0.3 }); hfNote(tl, "#f-sdn", C.l87, 2.6);
          hide("#f-sd", C.l89 - 0.4);
          tl.to("#f-bs", { opacity: 1, duration: 0.4 }, C.l89 - 0.4);
          hfFocus(tl, "#f-bs", [2, 3, 4, 6, 15], C.l89);
          ["#f-bh8", "#f-bh9", "#f-bh10", "#f-bh12"].forEach((h, i) => tl.fromTo(h, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, C.l89 + 0.2 + i * 0.15));
          tl.fromTo("#f-bh21", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, C.l90 + 0.4);
          // 镜头和画面，每一支按内容重新做：三支片子的画面各不一样
          hide("#f-bs", C.l91 - 0.4);
          ["#f-e1", "#f-e2", "#f-e3"].forEach((e, i) => hfArrive(tl, e, C.l91 - 0.3 + i * 0.25, { z: -1200, rx: 8 }));
          tl.to("#f-in", { opacity: 0, filter: "blur(10px)", duration: 0.55, ease: "power2.in" }, C.end - 0.6);

          window.__timelines["actF"] = tl;
        })();
      </script>
    </template>
