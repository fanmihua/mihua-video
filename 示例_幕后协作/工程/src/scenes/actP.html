<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*@THEME@*/
        /* actP 尾幕（作者自己写的那段），做成电影片尾（片尾字幕像电影那样连续滚动，不是一行行换）：
           左边：作者的 AI 迷你电影《仅供参考》装在一段胶片里（上下两排片孔），先停在封面，再播正片（静音），下面一张片盒标签；
           右边：真正的片尾滚动字幕——顶上固定「片尾」小标题 + 细线，下面一整列居中，连续往上走，
           每一句经过中间那条阅读线的时候正好说到它：当前最亮，后面的淡淡露着，走过的压暗，上下边缘渐隐；「举一反三」反白；
           最后收在片尾标题卡上，压黑。这一章底部不出字幕（noCaptions），SRT 照常完整。 */
        #p-root { position: absolute; inset: 0; color: var(--ink); font-family: "PuHui", sans-serif; }
        /* 胶片 */
        #p-strip { position: absolute; left: 150px; top: 196px; width: 780px; height: 648px; background: #0a0a0b; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 40px 100px rgba(0,0,0,0.7); opacity: 0; }
        #p-strip::before, #p-strip::after { content: ""; position: absolute; left: 14px; right: 14px; height: 22px;
          background: repeating-linear-gradient(90deg, rgba(235,235,232,0.22) 0 22px, transparent 22px 44px); -webkit-mask-image: linear-gradient(180deg, transparent 0 5px, #000 5px 17px, transparent 17px); mask-image: linear-gradient(180deg, transparent 0 5px, #000 5px 17px, transparent 17px); border-radius: 3px; }
        #p-strip::before { top: 16px; } #p-strip::after { bottom: 16px; }
        #p-film { position: absolute; left: 30px; top: 54px; width: 720px; height: 540px; overflow: hidden; background: #000; }
        #p-film img, #p-film video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #p-fno { position: absolute; right: 34px; top: 34px; font: 600 12px/1 "PuHui", sans-serif; letter-spacing: 0.3em; color: rgba(235,235,232,0.5); }
        #p-label { position: absolute; left: 150px; top: 872px; display: flex; align-items: center; gap: 16px; opacity: 0; }
        #p-label b { padding: 7px 14px 8px; border-radius: 3px; background: #ecebe6; color: #161616; font: 700 22px/1 "ShuHei", sans-serif; letter-spacing: 0.04em; }
        #p-label span { font: 500 18px/1 "PuHui", sans-serif; letter-spacing: 0.12em; color: rgba(255,255,255,0.55); }
        /* 片尾字幕 */
        #p-head { position: absolute; left: 1040px; width: 720px; top: 172px; text-align: center; opacity: 0; }
        #p-head em { display: block; font: 600 18px/1 "PuHui", sans-serif; font-style: normal; letter-spacing: 0.6em; color: rgba(255,255,255,0.6); padding-left: 0.6em; }
        #p-head i { display: block; width: 64px; height: 1.5px; margin: 18px auto 0; background: rgba(255,255,255,0.45); }
        #p-roll { position: absolute; left: 1040px; top: 236px; width: 720px; height: 660px; overflow: hidden;
          -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 24%, #000 76%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0%, #000 24%, #000 76%, transparent 100%); }
        #p-lines { position: absolute; left: 0; top: 0; width: 720px; }
        .p-l { position: absolute; left: 0; width: 720px; text-align: center; font: 700 34px/1.3 "ShuHei", sans-serif; letter-spacing: 0.02em; color: #f4f4f6; white-space: nowrap; opacity: 0.22; }
        .p-l .k { position: relative; display: inline-block; margin: 0 6px; padding: 0 8px; }
        .p-l .k::before { content: ""; position: absolute; inset: 3px 0 2px; border-radius: 6px; background: #f4f4f4; transform: scaleX(var(--w, 0)); transform-origin: 0 50%; }
        .p-l .k i { position: relative; font-style: normal; color: var(--kc, #f4f4f6); }
        #p-read { position: absolute; left: 1060px; width: 680px; top: 565px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12) 20%, rgba(255,255,255,0.12) 80%, transparent); }
        #p-end { opacity: 0; }
        #p-end p { letter-spacing: 0.3em; }
        #p-black { position: absolute; inset: 0; background: #000; opacity: 0; }
      </style>
      <div id="p-root" data-composition-id="actP" data-width="1920" data-height="1080" data-duration="@@C.end@@">
        <div id="p-strip"><div id="p-film"><img src="assets/img/film_cover.jpg" alt="" /><video id="p-fv" src="assets/video/film.mp4" muted playsinline data-start="@@C.l3-0.2@@" data-duration="@@Math.min(14.7, C.l11-0.4-(C.l3-0.2))@@" data-media-start="0"></video></div><div id="p-fno">仅供参考 · 4:3</div></div>
        <div id="p-label"><b>AI 迷你电影《仅供参考》</b><span>我前阵子做的</span></div>
        <div id="p-head"><em>片尾</em><i></i></div>
        <div id="p-read"></div>
        <div id="p-roll"><div id="p-lines">
          <div class="p-l" data-l="l1">还想再多说一句</div>
          <div class="p-l" data-l="l2">这期视频里的很多方法</div>
          <div class="p-l" data-l="l3">其实是我前阵子「不务正业」</div>
          <div class="p-l" data-l="l4">去做 AI 迷你电影的时候</div>
          <div class="p-l" data-l="l5">练出来的</div>
          <div class="p-l" data-l="l6">做视频和拍电影，本来就是相通的</div>
          <div class="p-l" data-l="l7">所以在 AI 时代，多去试试新东西</div>
          <div class="p-l" data-l="l8">是一件好事</div>
          <div class="p-l" data-l="l9">试完之后，怎么跟手上的事关联起来</div>
          <div class="p-l" data-l="l10">怎么<span class="k"><i>举一反三</i></span>，这才是最重要的</div>
        </div></div>
        <div class="endcard" id="p-end"><h2>用 AI 做一支讲解视频</h2><div class="rule" id="p-rule"></div><p>范米花儿</p></div>
        <div id="p-black"></div>
      </div>
      <script>
        //@COMMON_JS@
        (function () {
          const C = /*@CUES@*/;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#p-strip", { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out" }, 0.05);
          tl.fromTo("#p-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.6);
          tl.fromTo("#p-head", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.3);
          // 片尾字幕：一整列连续往上走。每一句的中线在说到它的那一刻经过阅读线（#p-read），中间匀速走（分段线性）
          const lines = [...document.querySelectorAll(".p-l")], LH = 92, READ = 565 - 236 - 22;   // 阅读线在滚动区里的位置（减去半行）
          lines.forEach((el, i) => { el.style.top = i * LH + "px"; });
          const rl = document.getElementById("p-lines"), roll = { y: READ + LH * 1.5 };
          const ap = () => { rl.style.transform = "translateY(" + roll.y.toFixed(2) + "px)"; }; ap();
          let prev = 0.2;
          lines.forEach((el, i) => {
            const a = C[el.dataset.l] + 0.15;
            tl.to(roll, { y: READ - i * LH, duration: Math.max(0.3, a - prev), ease: i ? "none" : "power2.out", onUpdate: ap }, prev);
            prev = a;
            tl.to(el, { opacity: 1, duration: 0.35, ease: "power2.out" }, a - 0.45);
            tl.to(el, { opacity: 0.22, duration: 0.6, ease: "power2.in" }, (C[el.dataset.l + "e"] || a + 1.5) + 0.25);
          });
          // 最后一句之后，字幕继续往上走一点再收
          tl.to(roll, { y: READ - lines.length * LH - LH, duration: C.l11 - prev, ease: "power1.in", onUpdate: ap }, prev);
          // 「举一反三」反白（和底部字幕的关键词一样）
          tl.fromTo(".p-l .k", { "--w": 0, "--kc": "#f4f4f6" }, { "--w": 1, "--kc": "#111111", duration: 0.35, ease: "power2.out" }, C.l10 + 0.5);
          // 「今天的视频就到这里了」：收在片尾标题卡上，压黑
          tl.to(["#p-strip", "#p-label", "#p-head", "#p-roll", "#p-read"], { opacity: 0, filter: "blur(10px)", duration: 0.8, ease: "power2.in" }, C.l11 - 0.5);
          tl.fromTo("#p-end", { opacity: 0 }, { opacity: 1, duration: 0.7 }, C.l11 + 0.1);
          tl.fromTo("#p-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, C.l11 + 0.3);
          tl.to("#p-black", { opacity: 1, duration: 0.8, ease: "power2.in" }, C.end - 0.8);
          window.__timelines["actP"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
